[project]
name = "swarmcare"
version = "0.2.0"
description = "Synthetic multi-agent hospital simulation comparing greedy, fuzzy, PSO and decentralized resource allocation during pandemic surges."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "matplotlib>=3.7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
